name: ARGUS CI Pipeline

on:
  push:
    branches: [ "main", "Arijeet" ]
  pull_request:
    branches: [ "main", "Arijeet" ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic migration heads
        run: |
          alembic heads

      - name: Run full Pytest test suite
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Typecheck and build production bundle
        run: |
          npm run build
