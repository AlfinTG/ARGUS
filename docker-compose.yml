services:
  db:
    image: postgres:16-alpine
    container_name: argus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus_secure_pass_demo}
      POSTGRES_DB: ${POSTGRES_DB:-argus_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_user -d argus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
